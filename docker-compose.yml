services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-this-to-something-random}
      - DATABASE_URL=postgresql+psycopg2://astrolink:astrolink@db:5432/astrolink
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: astrolink
      POSTGRES_USER: astrolink
      POSTGRES_PASSWORD: astrolink
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astrolink"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
